services:
  updates:
    image: nginx:stable-alpine
    container_name: nnu-rustdesk-updates
    restart: unless-stopped
    ports:
      - "127.0.0.1:32170:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/srv/updates:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 96m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
